<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Violet/Purple Gradient matching screenshot -->
    <linearGradient id="elrizoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="45%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#5500CC" />
    </linearGradient>

    <!-- Orange Star/Dot Gradient -->
    <radialGradient id="orangeDot" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="35%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FF5500" />
    </radialGradient>

    <!-- Soft ambient glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Purple Rounded Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="34" ry="34" fill="url(#elrizoBg)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="7.5" y="7.5" width="113" height="113" rx="32.5" ry="32.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2.5" />

  <!-- Bold White 'E' -->
  <path d="M42 34 H84 C86.5 34 88 35.5 88 38 V48 C88 50.5 86.5 52 84 52 H58 V58 H79 C81.5 58 83 59.5 83 62 V70 C83 72.5 81.5 74 79 74 H58 V80 H84 C86.5 80 88 81.5 88 84 V94 C88 96.5 86.5 98 84 98 H42 C39.5 98 38 96.5 38 94 V38 C38 35.5 39.5 34 42 34 Z" fill="#FFFFFF" />

  <!-- Glowing Orange/Gold Dot at Top-Right of 'E' -->
  <circle cx="94" cy="34" r="10" fill="#FF8800" opacity="0.4" filter="url(#softGlow)" />
  <circle cx="94" cy="34" r="7.5" fill="url(#orangeDot)" />
  <circle cx="92.5" cy="32.5" r="2.2" fill="#FFFFFF" opacity="0.8" />
</svg>