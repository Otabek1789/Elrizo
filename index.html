<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ELRIZO - Siz rozi — biz rozi! | Nasiya Savdo Bozori</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      vercel-live-feedback,
      #vercel-live-feedback-host,
      [data-vercel-toolbar],
      [data-vercel-edit-mode] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
      }
    </style>
    <script>
      try {
        const stored = localStorage.getItem('elrizo_store_v3') || localStorage.getItem('elrizo_nasiya_storage');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed?.state?.theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }
      } catch (e) {}

      // Vercel toolbar injection blocker
      try {
        const removeVercelToolbar = () => {
          const els = document.querySelectorAll('vercel-live-feedback, #vercel-live-feedback-host, [data-vercel-toolbar]');
          els.forEach(el => el.remove());
        };
        const obs = new MutationObserver(removeVercelToolbar);
        obs.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', removeVercelToolbar);
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F8F9FA] dark:bg-[#0B0F19] text-[#1F2937] dark:text-gray-100 font-sans antialiased selection:bg-purple-200 selection:text-purple-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
